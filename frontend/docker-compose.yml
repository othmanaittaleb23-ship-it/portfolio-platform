version: '3.8'

services:
  # --- FRONTEND ANGULAR ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    ports:
      - "80:80"
    networks:
      - portfolio-network
    restart: always

  # --- BASE DE DONNÉES POSTGRESQL (Futurs Microservices) ---
  postgres:
    image: postgres:15-alpine
    container_name: portfolio-postgres
    environment:
      POSTGRES_DB: portfolio_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - portfolio-network
    restart: always

networks:
  portfolio-network:
    driver: bridge

volumes:
  postgres_data: