<section style="min-height: calc(100vh - 80px); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px;">
  <div>
    <h1 style="font-size: 3.5rem; line-height: 1.1; margin-bottom: 15px;">
      {{ profile?.fullName }}
    </h1>
    <p style="font-size: 1.5rem; color: var(--primary-neon); font-weight: 500; text-shadow: 0 0 15px var(--primary-neon); margin-bottom: 10px;">
      {{ profile?.title }}
    </p>
    <p style="color: var(--text-secondary); margin-bottom: 30px; font-weight: 300; max-width: 600px; margin-left: auto; margin-right: auto; line-height: 1.6;">
      {{ profile?.bio }}
    </p>
    
    <div style="display: flex; gap: 20px; justify-content: center; margin-bottom: 60px;">
      <a routerLink="/projects" class="btn-3d btn-primary">
        Voir mes Projets
      </a>
      <a routerLink="/contact" class="btn-3d btn-outline">
        Me Contacter
      </a>
    </div>

    <!-- Grille de Statistiques Clés -->
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; max-width: 950px; width: 100%; margin: 0 auto;">
  <div *ngFor="let stat of stats" class="card-3d-out" style="padding: 28px 20px; background: rgba(17, 22, 37, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.06); text-align: center; border-radius: 16px; transition: transform 0.3s ease;">
    
    <!-- Icône / Indicateur Vectoriel -->
    <div style="display: inline-flex; align-items: center; justify-content: center; width: 50px; height: 50px; margin-bottom: 12px; background: rgba(0, 240, 255, 0.08); border-radius: 12px; border: 1px solid rgba(0, 240, 255, 0.2); color: var(--primary-neon);">
      <!-- Affichage dynamique ou conditionnel selon l'icône de la stat -->
      <span style="font-size: 1.4rem;">{{ stat.icon }}</span>
    </div>

    <h3 style="font-size: 2rem; color: var(--primary-neon); font-weight: 700; margin-bottom: 6px; letter-spacing: -0.02em;">
      {{ stat.value }}
    </h3>
    <p style="color: var(--text-secondary); font-size: 0.85rem; font-weight: 300; line-height: 1.4;">
      {{ stat.label }}
    </p>
  </div>
</div>

  </div>
</section>
