<section class="contact-section" style="max-width: 800px; margin: 50px auto; padding: 0 24px;">
  <div style="text-align: center; margin-bottom: 40px;">
    <h2 style="font-size: 2.5rem; font-weight: 700; margin-bottom: 10px;">Contactez-moi</h2>
    <p style="color: var(--text-secondary); font-weight: 300;">Une opportunité de stage, un projet ou une question ? Écrivez-moi directement.</p>
  </div>

  <div class="card-3d-out" style="padding: 40px; background: rgba(17, 22, 37, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.06);">
    
    <!-- Message de succès -->
    <div *ngIf="submitSuccess" style="margin-bottom: 25px; padding: 15px; background: rgba(76, 175, 80, 0.1); border: 1px solid #4caf50; border-radius: 8px; color: #4caf50; text-align: center; font-weight: 500;">
      ✨ Votre message a été envoyé avec succès ! Je vous répondrai dans les plus brefs délais.
    </div>

    <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: 20px;">
      
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
        <div>
          <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 8px;">Votre Nom</label>
          <input type="text" formControlName="name" placeholder="Ex: Jean Dupont" style="width: 100%; padding: 12px 16px; background: var(--bg-app); border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; color: var(--text-primary); outline: none;">
        </div>
        <div>
          <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 8px;">Votre Email</label>
          <input type="email" formControlName="email" placeholder="Ex: jean@example.com" style="width: 100%; padding: 12px 16px; background: var(--bg-app); border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; color: var(--text-primary); outline: none;">
        </div>
      </div>

      <div>
        <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 8px;">Sujet</label>
        <input type="text" formControlName="subject" placeholder="Ex: Opportunité de poste Développeur Full Stack" style="width: 100%; padding: 12px 16px; background: var(--bg-app); border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; color: var(--text-primary); outline: none;">
      </div>

      <div>
        <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 8px;">Message</label>
        <textarea formControlName="message" rows="5" placeholder="Votre message..." style="width: 100%; padding: 12px 16px; background: var(--bg-app); border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; color: var(--text-primary); outline: none; resize: vertical;"></textarea>
      </div>

      <button type="submit" [disabled]="contactForm.invalid || isSubmitting" class="btn-3d btn-primary" style="width: 100%; justify-content: center; margin-top: 10px; opacity: contactForm.invalid ? 0.6 : 1;">
        {{ isSubmitting ? 'Envoi en cours...' : 'Envoyer le message' }}
      </button>

    </form>
  </div>
</section>
